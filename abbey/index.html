/* ===== EDITABLE CONTENT ===== */
const SETUP=`<p class="lead">April 1526, the Allgäu. A year ago the peasants of the abbey’s villages broke into the abbey, drank the cellar, and burned the rent books. Then the Swabian League destroyed them at Leubas, a few miles from the gate, and the abbey has been fining the villages for the damage ever since.</p>
<p>This morning Prior Konrad, who kept the accounts and collected the fines, was found dead at the bottom of the counting-room stair. You are a lawyer from Nuremberg who happened to be staying the night on your way to Augsburg. The abbey answers to the Bishop of Augsburg, and the bishop’s court looks into any death inside a religious house. His officials are three days away. The abbot wants a statement from you, an outsider, that he can hand them when they arrive.</p>`;
const ARRIVAL={"art": "cloister", "date": "The abbey of St. Veit · 26 April 1526", "title": "Before matins", "text": "<p>Brother Ulrich, the guestmaster, wakes you. He is the monk in charge of visitors. The prior is dead on the counting-room stair. The abbot has asked that you, as a lawyer and a stranger here, write a statement about the death that he can hand to the bishop’s officials when they arrive in three days. “An honest statement,” the abbot said, “with a lawyer’s name on it.”</p>\n<p>Ulrich tells you what he knows. Brother Anselm, the infirmarian, examined the body before it was moved. The abbot has already written to the Swabian League and has a copy for you. The bailiff arrested Lienhard Kern, the headman of the village of Oberdorf, at dawn; Kern was in the abbey last night arguing with the prior about his village’s fine. A printer from Augsburg was also here last night, also arguing with the prior, and is now at the inn in Oberdorf. Brother Matthias, the librarian, was the last of the monks seen talking with the prior. Ulrich suggests you start with the body.</p>"};
const DOCS=[{"id": "D2", "n": 1, "icon": "mortar", "hubT": "See the body", "who": "Brother Anselm, infirmarian", "date": "The counting-room stair · 26 April 1526", "title": "The register of the dead", "expect": "The infirmarian examined the body before anyone moved it. He writes things down.", "lead": "Key missing. Abbot has the only other one. Blood at the top step and the bottom, little between. Abbot ordered a quick burial.", "intro": "<p>Brother Anselm is a small grey man with ink on his fingers. He is the infirmarian: he nurses the sick, and when they die he prepares the body for burial and enters the death in the register. He wrote down what he found before they moved the body and hands you the register without comment.</p>", "src": "<b>Document 2.</b> Entry in the abbey’s register of the dead, written in Latin by Brother Anselm, the infirmarian, who is responsible for the care of the sick and the preparation of bodies for burial. 26 April 1526.", "text": "<p>On this day Konrad, prior of this house, was found dead at the foot of the counting-room stair by the lay brother who rings for matins, a little before the second hour. I was called and examined the body before it was moved. He had been dead some hours; the limbs were stiff. The wound was a single one, at the back of the head, above the left ear. There was blood on the edge of the third step from the top and more on the floor below, but little on the steps between. The door of the counting room at the top of the stair was locked. The prior’s key, which he wore on a cord at his belt, was not on him, and we did not find it on the stair. The only other key is kept by the Father Abbot.</p>\n<p>The Father Abbot came to the stair after matins had ended, and ordered the body washed and laid out in the chapel, and buried tomorrow, saying that the bishop’s men must not find a corpse in the house a year after the troubles. I have recorded what I saw, as my office requires.</p>", "qs": [{"q": "Why did he write this?", "opts": [{"t": "To accuse the abbot."}, {"t": "Because it is his job to record deaths. He accuses no one.", "ok": true}, {"t": "To get the lawyer to stay."}], "why": "A routine record. No audience, no argument."}, {"q": "What in it can you rely on?", "opts": [{"t": "That the abbot is guilty because he wanted a fast burial."}, {"t": "The missing key and the blood on the steps. Physical facts, written down by the man whose job was to look.", "ok": true}, {"t": "That the lay brother found him."}], "why": "He had no reason to invent a missing key. The fast burial has an innocent explanation; the key does not."}], "reason": "Physical facts recorded by someone whose job it was, with nothing to gain."}, {"id": "D3", "n": 2, "icon": "crozier", "hubT": "Speak with the Abbot", "who": "Johannes von Seckendorff, Abbot", "date": "The abbot’s parlor · 27 April 1526", "title": "The abbot’s letter to the League", "expect": "He has already written to the Swabian League. He will give you a copy.", "lead": "Abbot says the key was still on the body. Names Kern. Asks the League for horsemen and for the fines to be confirmed.", "intro": "<p>The abbot has the only good fire in the house. He is sorry for your trouble and hands you a copy of his letter before you sit down. When asked where he was when the prior fell, he says simply: at compline.</p>", "src": "<b>Document 3.</b> Letter from Johannes von Seckendorff, Abbot of St. Veit, to Georg Truchsess von Waldburg, commander of the army of the Swabian League, which crushed the Allgäu peasants in 1525 and is still punishing them. Dictated to a scribe, 27 April 1526. The abbot gave you the scribe’s copy “so that you understand the situation.”", "text": "<p>Most noble Lord. I write to tell you that the rebellion in these parts is not ended but only sleeping. On the night of the 25th of April, the very anniversary of the day the peasants plundered this house, my prior, Father Konrad, who had charge of collecting the fines Your Lordship’s commissioners imposed on our villages, was murdered on the stair of the counting room. He was found with his key to that room still on his belt, so robbery was not the motive; it was hatred of the Church and of lawful authority.</p>\n<p>Lienhard Kern, headman of our village of Oberdorf, who marched with the rebels last year and has been fined for it, was in this house that evening demanding that his fine be forgiven, and was heard by my servants to say that the prior would answer to God for what he was doing to the villages. I have ordered him held. I beg Your Lordship to send a dozen horsemen to St. Veit, so that the villages may see that the League has not forgotten them, and to confirm the fines, which barely cover the damage done to us, as my account printed last year shows.</p>", "qs": [{"q": "What is the letter for?", "opts": [{"t": "To report a crime, as the law requires."}, {"t": "To get soldiers and get the fines confirmed. For that, the villages have to look dangerous, so the killer has to be a peasant.", "ok": true}, {"t": "To keep Kern safe from the villagers."}], "why": "Read the last sentence: horsemen, fines, the printed account of his losses."}, {"q": "Which claim needs checking?", "opts": [{"t": "That the key was still on the body.", "ok": true}, {"t": "That the prior collected the fines."}, {"t": "That a scribe wrote it down."}], "why": "The infirmarian says the key was gone. One of them is wrong, and only one of them had a reason to be."}], "reason": "A claim that contradicts the physical record, by a man with a reason to make it."}, {"id": "D4", "n": 3, "icon": "book", "hubT": "Find Brother Matthias", "who": "Brother Matthias, librarian", "date": "The library · 28 April 1526", "title": "Brother Matthias’s letter", "expect": "He reads Luther, and he quarreled with the prior that night. He wants you to carry a letter to Augsburg.", "lead": "Matthias admits the quarrel. Says he heard two voices in the counting room late, one of them “the voice that gives orders in this house.”", "intro": "<p>Matthias is young, thin, and frightened. He asks you to carry a sealed letter to Augsburg and not to read it. You read it.</p>", "src": "<b>Document 4.</b> Letter from Brother Matthias, keeper of the abbey’s library, to a merchant of Augsburg named Hieronymus who supports Luther’s teaching and has helped former monks find positions in the city. Written secretly, 28 April 1526. Matthias asked you to carry it to Augsburg, trusting a Nuremberg lawyer not to open it. You opened it.", "text": "<p>Honored sir. I write again to ask whether a place can be found for me in your city, for I cannot stay in this house. You know from my last letter that the prior had taken my books, including the German Testament and the sermons you sent me, and had told the abbot that I was reading Luther. On the evening of the 25th I went to him after supper to ask for them back and we had hard words; he said I would have them when I had confessed my errors to the abbot. I tell you this plainly because others will tell it crookedly.</p>\n<p>You should know what kind of man he was. He squeezed the villages for the fines until they sold their cattle, and he knew, because he kept the books, that the abbot’s printed account of our losses last year claimed twice what was taken. I have heard the abbot say in chapter that the League would pay better attention to a house that had suffered greatly.</p>\n<p>That night I could not sleep and went down to the cloister after compline. There was a light in the counting room, late, and two voices above, one of them the voice that gives the orders in this house. I did not go up. In the morning the prior was dead. I say nothing of this here to anyone, and I ask you to burn this letter.</p>", "qs": [{"q": "What does Matthias want?", "opts": [{"t": "To confess."}, {"t": "A job in Augsburg, and to get his version in first.", "ok": true}, {"t": "To defend the abbot."}], "why": "“Others will tell it crookedly.” He knows he looks guilty."}, {"q": "He hates the abbot and wants out. What can you still use?", "opts": [{"t": "His opinion of the prior."}, {"t": "Nothing. He is biased."}, {"t": "The quarrel, which makes him look bad, and the two voices, which he does not use to accuse anyone.", "ok": true}], "why": "Keep what hurts him. Set aside what helps him."}], "reason": "A detail against the writer’s own interest, or one he does not use to accuse anyone."}, {"id": "D5", "n": 4, "icon": "boot", "hubT": "Question Lienhard Kern", "who": "Lienhard Kern, headman of Oberdorf", "date": "The gatehouse · 27 April 1526", "title": "Kern’s deposition", "expect": "Held since the 26th. The bailiff questioned him already and will not let you do it alone.", "lead": "Kern denies any threat. Says the printer argued with the prior about money. Told you to look at the prior’s books. Taken under threat by the abbot’s bailiff.", "intro": "<p>The bailiff hands you the deposition and stands in the door. Through the bars Kern says only one thing to you: look at the prior’s books.</p>", "src": "<b>Document 5.</b> Deposition of Lienhard Kern, headman of the village of Oberdorf, taken by the abbey’s bailiff in the gatehouse on 27 April 1526, with the bailiff’s two armed servants present. Kern cannot write; the bailiff’s clerk recorded his answers and Kern made his mark. Under the terms the League imposed on the villages after 1525, a peasant found to have threatened a cleric may be hanged without further trial.", "text": "<p>Asked whether he was in the abbey on the evening of the 25th, he says yes, he came to ask the prior for time to pay the fine on his village, because the seed grain was gone and the people had nothing.</p>\n<p>Asked whether he threatened the prior, he says no, by God and all the saints, he never did; he said only that the villages could not pay and that God saw it.</p>\n<p>Asked whether he marched with the rebels in April of last year, he says he went with them to the abbey because every man in the village was made to go, and that he took nothing and struck no one, and that the prior himself knew this.</p>\n<p>Asked who else was in the abbey that evening, he says that when he was sent away from the prior’s door he heard the prior arguing with the printer from Augsburg in the counting room about money, and the printer saying he would be paid one way or another. He says he went home to Oberdorf before dark and his wife and neighbors can swear to it.</p>\n<p>Asked again whether he threatened the prior, he says no. He begs the bailiff to believe him, and says he has told the truth as he told it to the prior before.</p>", "qs": [{"q": "Under what conditions was this given?", "opts": [{"t": "Freely, to a friendly investigator."}, {"t": "To the abbot’s own bailiff, with two armed men in the room, under a rule that can hang him for a threat.", "ok": true}, {"t": "Under oath before a judge, with a lawyer."}], "why": "It is all in the source line."}, {"q": "Why does he name the printer?", "opts": [{"t": "He saw the printer do it."}, {"t": "A man answering under threat needs someone else to have been in the room. The printer is the only stranger.", "ok": true}, {"t": "The printer owed him money."}], "why": "He does not say he saw anything. He says he heard an argument about money, which the printer confirms."}], "reason": "Testimony under threat. It tells you what the questioner wanted."}, {"id": "D6", "n": 5, "icon": "press", "hubT": "Ride to the inn", "who": "Veit Hesse, printer of Augsburg", "date": "The inn at Oberdorf · 28 April 1526", "title": "The printer’s bill and statement", "expect": "He argued with the prior about money that evening. He is still at the inn, waiting to be paid.", "lead": "Printer was owed 23 gulden. Left at nightfall; the innkeeper saw him. Saw a candle in the library window after compline.", "intro": "<p>The printer puts his bill on the table before you sit down. He has printed for Luther’s friends and for the Pope’s, and he would like to be paid by somebody.</p>", "src": "<b>Document 6.</b> Statement of Veit Hesse, a printer of Augsburg, given to Dr. Eisenreich at the village inn at Oberdorf on 28 April 1526, together with his unpaid bill to the abbey.", "text": "<p><i>To the Abbey of St. Veit: for printing 300 copies of A True and Pitiable Account of the Plundering of the Abbey of St. Veit, with woodcut, delivered June 1525: 14 gulden. For printing 500 copies of the Schedule of Fines upon the Villages, delivered August 1525: 9 gulden. Total owed: 23 gulden. Nothing received.</i></p>\n<p>I came to the abbey on the 25th to collect this debt, which is ten months old. The prior received me in the counting room and refused to pay. He said the abbot had learned that my press had printed the Twelve Articles for an Augsburg bookseller in the spring of 1525, before I printed the abbey’s account, and that a man who prints for both sides should be glad he is not in the League’s hands. I told him that a printer prints what he is paid to print and that the Articles were printed in forty cities. We spoke loudly. I left at nightfall, before the gate was shut, and slept at this inn, where the innkeeper saw me. As I crossed the court I saw a candle burning in the library window, though the library is supposed to be dark after compline. I do not know whose it was. I want my 23 gulden and nothing else from this place.</p>", "qs": [{"q": "What does he want?", "opts": [{"t": "His 23 gulden, and some distance from the Twelve Articles.", "ok": true}, {"t": "To accuse Brother Matthias."}, {"t": "To report the abbey to the League."}], "why": "Everything he says serves getting paid and getting out. The candle serves neither."}, {"q": "What is the bill worth?", "opts": [{"t": "It proves he killed for the money."}, {"t": "It shows the abbey paid to print its own losses and its own fines. The abbey was making its case in print.", "ok": true}, {"t": "Nothing. A bill is not a historical document."}], "why": "A bill is not written to persuade anyone of anything but the amount."}], "reason": "A business record, plus a detail that has nothing to do with the writer’s purpose."}, {"id": "D7", "n": 6, "icon": "key", "hubT": "Search the prior’s cell", "who": "Prior Konrad, in his own hand", "date": "The prior’s cell · 28 April 1526", "title": "The prior’s notes in the margin", "expect": "Kern said to look at the prior’s books. Go while the abbot is at vespers.", "lead": "Prior’s own notes: true loss 160 gulden, printed claim 310. Kern’s fine cut in exchange for information. On 24 April the prior told the abbot he had written to the bishop.", "intro": "<p>Someone has tidied the desk. The key is not on its hook. Inside the back cover of the prior’s breviary is a folded printed sheet, written over in a small careful hand.</p>", "src": "<b>Document 7.</b> The abbey’s printed Schedule of Fines upon the Villages (the second item on the printer’s bill), with handwritten notes in the margins in Prior Konrad’s own hand. Found by Dr. Eisenreich in the prior’s cell, inside the cover of his breviary, on 28 April 1526. The last note is dated 24 April, the day before the prior died.", "text": "<p><i>[Printed:] Fines imposed on the four villages of the abbey for damages suffered in the plundering of April 1525, as reckoned by the Father Abbot and confirmed by the commissioners of the League: Oberdorf 120 gulden, Niederdorf 90 gulden, Weiher 60 gulden, Hainbach 40 gulden.</i></p>\n<p><i>[In the margin, beside the total:]</i> The true loss by my count, from the cellar and the books and the broken doors, is 160 gulden. The printed account claims 310. The Father Abbot says the League must see that we suffered, or they will not keep soldiers here. He has had the account sent to Augsburg and to the Count.</p>\n<p><i>[Beside Oberdorf:]</i> Kern’s own fine reduced from 10 to 4 gulden, for information given about the ringleaders, as agreed. Not to be known in the village.</p>\n<p><i>[At the bottom, dated 24 April:]</i> I have written to the Bishop’s chancellor at Augsburg that the account of our losses is false and that I will not sign the next schedule. I have told the Father Abbot that I have done so. God help this house.</p>", "qs": [{"q": "Who was meant to read this?", "opts": [{"t": "The League."}, {"t": "No one. Private notes hidden in a prayer book.", "ok": true}, {"t": "The villagers."}], "why": "The one paper in the file not written to persuade anybody."}, {"q": "What does it change?", "opts": [{"t": "It proves Kern did it; he wanted his fine gone entirely."}, {"t": "It proves the printer lied."}, {"t": "Kern was the prior’s informer, so he had no motive. The abbot had inflated the losses, and the prior told him the day before that he had written to the bishop.", "ok": true}], "why": "Motive and timing, in the dead man’s hand. Now reread the abbot’s letter."}], "reason": "A private note, never meant to be read by anyone else."}];

/* ================================================================== state and helpers */
let S=null;
const VISIT_BUDGET=4; // class mode: visits allowed after the body, out of five
function newState(mode){ return { mode:mode||'solo', scene:'arrival', read:{}, revealed:{}, ans:{}, tries:{}, locked:{}, checks:{}, flash:'', accused:null, ended:false, visits:0 }; }
const $=id=>document.getElementById(id);
const reading=$('reading'), btnRestart=$('btnRestart');
/* ---- sound ---- */
const AUDIO={music:null,on:true}; try{ AUDIO.on=localStorage.getItem('abbeySound')!=='off'; }catch(e){}
const btnSound=$('btnSound');
function soundConfigured(){ return typeof SOUND!=='undefined' && !!(SOUND.music||SOUND.page||SOUND.click); }
function sfx(kind){ if(!soundConfigured()||!AUDIO.on||!SOUND[kind]) return; try{ const a=new Audio(SOUND[kind]); a.volume=Math.min(1,Math.max(0,SOUND.volume||0.35)); a.play().catch(()=>{}); }catch(e){} }
function startMusic(){ if(!soundConfigured()||!SOUND.music||AUDIO.music) return; try{ AUDIO.music=new Audio(SOUND.music); AUDIO.music.loop=true; AUDIO.music.volume=Math.min(1,Math.max(0,(SOUND.volume||0.35)*0.6)); if(AUDIO.on) AUDIO.music.play().catch(()=>{}); }catch(e){} }
function paintSound(){ if(!btnSound) return; btnSound.hidden=!soundConfigured(); btnSound.textContent='Sound: '+(AUDIO.on?'on':'off'); }
if(btnSound) btnSound.addEventListener('click',()=>{ AUDIO.on=!AUDIO.on; try{localStorage.setItem('abbeySound',AUDIO.on?'on':'off')}catch(e){} if(AUDIO.music){ if(AUDIO.on) AUDIO.music.play().catch(()=>{}); else AUDIO.music.pause(); } else if(AUDIO.on) startMusic(); paintSound(); });
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; startMusic(); if(b.id!=='btnSound') sfx('click'); },true);
paintSound();
function save(){ try{ localStorage.setItem('abbey1526', JSON.stringify(S)); }catch(e){} }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const qk=(id,i)=>id+'_'+i;
const isClass=()=>S && S.mode==='class';
const VISITS=['D3','D4','D5','D6','D7'];
const nVisited=()=>VISITS.filter(id=>S.read[id]).length;
const visitsLeft=()=>VISIT_BUDGET-nVisited();
const nRead=()=>Object.keys(S.read).length;
const nLocked=()=>Object.keys(S.locked).length;
function docAnswered(d){ return d.qs.every((q,i)=>S.ans[qk(d.id,i)]!==undefined); }
function docLocked(d){ return d.qs.every((q,i)=>S.locked[qk(d.id,i)]); }
function checkDoc(d){ let ok=0,bad=0; d.qs.forEach((q,i)=>{ const k=qk(d.id,i); if(S.locked[k]) return; if(q.opts[S.ans[k]].ok){ S.locked[k]=true; ok++; } else bad++; }); S.checks[d.id]=(S.checks[d.id]||0)+1;
  S.flash = bad===0 ? `You note it in your casebook. Both readings of Document ${d.n} hold.` : `You note it in your casebook, then cross one out. ${ok} of your readings of Document ${d.n} hold; ${bad} does not. Reread the source line and try again.`; }
function art(k){ const u=(typeof IMAGES!=='undefined'&&IMAGES[k])||''; if(u) return `<div class="art artimg"><img src="${u.replace(/"/g,'&quot;')}" alt="" loading="lazy"></div>`; return ART[k]||''; }
function leadsBoard(){ const got=DOCS.filter(d=>S.read[d.id]&&d.id!=='D1'); if(!got.length) return ''; return `<div class="leads"><h4>What you know so far</h4><ul>${got.map(d=>`<li><b>${d.n}.</b> ${d.lead}</li>`).join('')}</ul></div>`; }

/* ================================================================== screens */
function go(scene,resuming){ S.scene=scene; btnRestart.hidden=false; save();
  const paint=()=>{ if(scene==='arrival') renderArrival(); else if(scene==='hub') renderHub(); else if(scene.startsWith('doc:')) renderDoc(scene.slice(4)); else if(scene==='accuse') renderAccuse(); else if(scene==='end') renderEnd(); else renderStart();
    if(!resuming) window.scrollTo({top:0,behavior:'auto'}); };
  if(resuming) paint(); else transition(paint); }
function transition(paint){ const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ paint(); return; } reading.classList.add('out'); setTimeout(()=>{ paint(); sfx('page'); reading.classList.remove('out'); },220); }

<h2>The cloister</h2>
<div class="who">You are Dr. Wolfgang Eisenreich, lawyer of Nuremberg${cls?'':' · '+nRead()+' of 6 documents read · '+nLocked()+' of 12 readings hold'}</div>
${flash?`<div class="flash">${flash}</div>`:''}
${cls?`<div class="status"><span>Visits left before the bishop’s men arrive: <b>${Math.max(0,left)}</b> of ${VISIT_BUDGET}</span><span class="sp"></span><span>${left>0?'':'No time left. Make your accusation.'}</span></div>`:''}

function renderDoc(id){

    : `<div class="sect">Who wrote this, and what does that do to it as a source?</div>
${d.qs.map((q,i)=>{ const k=qk(id,i), a=S.ans[k], lk=!!S.locked[k], wr=!lk && S.checks[id] && a!==undefined; return `<div class="q${wr?' wrong':''}"><div class="qt">${q.q}</div>${q.opts.map((o,j)=>`<label class="opt${a===j?(lk?' lock':' sel'):''}"><input type="radio" name="${k}" value="${j}" ${a===j?'checked':''} ${lk?'disabled':''}>${o.t}</label>`).join('')}${lk?`<p class="why">${q.why}</p>`:''}</div>`; }).join('')}
<div class="row" style="margin:14px 0 0"><button class="btn" type="button" id="btnCheck" ${docAnswered(d)&&!docLocked(d)?'':'disabled'}>${docLocked(d)?'Noted in your casebook':'Note it in your casebook'}</button><button class="btn quiet" type="button" id="btnBack">Back to the cloister</button></div>`;
  reading.innerHTML=`<article class="scene fade">

<div class="src">${rnd(d.icon,44)}<span>${d.src}</span></div>
${d.text}
${qblock}
</div>
</article>`;
  if(cls){ }
  else {
    reading.querySelectorAll('.q input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ S.ans[r.name]=+r.value; S.tries[r.name]=(S.tries[r.name]||0)+1; save(); r.closest('.q').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked)); r.closest('.q').classList.remove('wrong'); $('btnCheck').disabled=!(docAnswered(d)&&!docLocked(d)); }));

  }
  $('btnBack').addEventListener('click',()=>go('hub'));
}

  const upd=()=>{ const ok=!!who; $('btnSend').disabled=!ok; $('warn').textContent= ok?(cited.size?'':'You are accusing with no documents behind you.'):'Choose a suspect.'; reading.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked)); };
  reading.querySelectorAll('input[name=who]').forEach(r=>r.addEventListener('change',()=>{ who=r.value; upd(); }));
  reading.querySelectorAll('#atts input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{ const sel=reading.querySelector(`select[data-doc="${c.value}"]`); if(c.checked){ if(cited.size>=3){ c.checked=false; return; } cited.set(c.value, sel.value); sel.disabled=false; } else { cited.delete(c.value); sel.disabled=true; sel.value=''; } upd(); }));

  $('btnSend').addEventListener('click',()=>{ S.accused={who, cites:[...cited.entries()].map(([d,r])=>({d, r:r===''?null:+r}))}; S.ended=true; save(); go('end'); });

/* ================================================================== evaluation and ending */
function evaluate(){
  const a=S.accused, out=[]; let score=0;
  const sup=SUPPORT[a.who]||[];
  if(a.who==='abbot'){ out.push('You named the abbot. That is where the documents point once they are sourced: the only physical record contradicts the only person who claimed the key was on the body; the one private note in the file gives him motive and tells you he knew the day before; and the one hostile witness gives a detail he did not use to accuse anyone.'); score+=3; }
  else if(a.who==='kern'){ out.push('You named the peasant, which is what the abbot wrote to the League and what the bailiff’s questions were built to produce. Kern’s deposition was given under threat, and the prior’s own margin notes show Kern was his informer, with his fine quietly cut in exchange. He is the man the file was arranged to make you choose.'); }
  else if(a.who==='matthias'){ out.push('You named the monk. He quarreled with the prior and he was up that night, both of which he admits. But a witness who tells you the things that hurt him is usually telling the truth about them, and the voice he heard giving orders in the counting room was not his own.'); }
  else if(a.who==='printer'){ out.push('You named the printer, on the word of a man answering the abbot’s bailiff with two armed servants in the room. The printer’s own account is shaped by wanting his 23 gulden, but his alibi is a stranger with no stake, the innkeeper, and his one unnecessary detail, the candle in the library, is true.'); }
  else { out.push('You called it a fall. The infirmarian’s register makes that hard: blood at the top of the stair and at the bottom and little between, and a key gone from a locked room. Someone was on that stair with him, and someone took the key.'); }
  a.cites.forEach(c=>{ const d=DOCMAP[c.d]; const supports=sup.includes(c.d); const idx=DOCS.indexOf(d); const reasonOk = c.r===idx;
    if(supports){ out.push(`Document ${d.n} (${d.title}) supports your accusation.`+(reasonOk?' Your reason for trusting it is the right one, which is the sourcing point.':(c.r===null?' You gave no reason for trusting it, so it is a quotation without sourcing.':' The reason you gave does not fit this document; look at who wrote it and for whom.'))); score+=1+(reasonOk?1:0); }
    else { out.push(`Document ${d.n} (${d.title}) does not support the accusation you made`+(reasonOk?', though your reason for trusting it is correct as a description of the document.':'.')); score+= reasonOk?0.5:0; }
  });
  if(a.cites.length===0) out.push('You cited nothing. A name with no documents is an opinion, and the bishop’s men have heard plenty of those.');
  if(a.who==='abbot' && !a.cites.some(c=>c.d==='D2')) out.push('You left out the infirmarian’s register, the only document in which someone with no stake writes down what he saw. The whole case against the abbot stands on the key, and the key is there.');
  if(a.who==='abbot' && S.read.D7 && !a.cites.some(c=>c.d==='D7')) out.push('You left out the prior’s notes, the only paper never meant to be read. They are the motive and the timing.');
  if(!S.read.D7) out.push('You never searched the prior’s cell. The motive was in his breviary: the abbot’s printed losses were nearly double the real ones, and the prior had told him the day before that he had written to the bishop. Without it, the case against the abbot rests on the key alone, which is strong but not enough for a hanging.');
  return {out, score, max:9};
}
function recordText(){ const a=S.accused; const first=Object.keys(S.locked).filter(k=>S.tries[k]===1).length;
  const s=`DEATH IN THE ABBEY — RUN RECORD (${S.mode})\nDocuments read: ${nRead()}/6`+(isClass()?'':` · Readings that hold: ${nLocked()}/12 (${first} on first try) · Casebook checks: ${DOCS.map(d=>d.n+':'+(S.checks[d.id]||0)).join(' ')}`)+`\nAccused: ${a.who} · Cited: ${a.cites.map(c=>c.d.replace('D','')+(c.r!==null?'('+(c.r+1)+')':'')).join(', ')||'none'}`;
  return s+`\nRecord code: ${hash(s+JSON.stringify(S.tries)+JSON.stringify(S.read))}`; }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'A-'+(Math.abs(h)%46656).toString(36).toUpperCase().padStart(3,'0'); }

function renderEnd(){
  S.ended=true; save(); const ev=evaluate(); const a=S.accused;
    reading.innerHTML=`<article class="scene ending fade">
<p class="date">The abbey of St. Veit · 29 April 1526</p>
<h2>${a.who==='abbot'?'The bishop’s men ask for the second key':'The bishop’s men take your name and leave'}</h2>
<div class="who">You were Dr. Wolfgang Eisenreich, lawyer of Nuremberg</div>
${art('chapter')}
<div class="body">
${a.who==='abbot'?`<p>The bishop’s chancellor has had the prior’s letter since the day he died. He asks the abbot for the second key to the counting room. The abbot says it is lost. The chancellor says that is a pity, and that the abbot will come to Augsburg to explain the account of his losses. Kern walks home that afternoon. Nobody tells the village why his fine was small.</p>`:
 a.who==='kern'?`<p>Kern is hanged at the abbey gate on the first of May, in front of the villages, with a dozen of the League’s horsemen watching. The abbot preaches on obedience. Three weeks later the bishop’s chancellor, who has had a letter from the dead prior since the 25th of April, calls the abbot to Augsburg to explain the account of the abbey’s losses. The abbot resigns his office for reasons of health. The fines stand.</p>`:
 `<p>The man you named is held for a month and released when the bishop’s chancellor, who has had a letter from the dead prior since the 25th of April, calls the abbot to Augsburg to explain the account of the abbey’s losses. The abbot resigns his office for reasons of health. Nobody is ever tried for the prior’s death. The fines stand.</p>`}
<p>What happened on the stair was this. The prior had told the abbot on the 24th that he had written to the bishop. On the night of the 25th the abbot went up to the counting room to get the letter’s draft and the schedule back. There was a quarrel at the top of the stair. The prior was struck or pushed and fell against the third step. The abbot took his key, locked the room, and went to bed, and in the morning had the body washed and the letter to the League written before anyone could ask him where he had been at compline.</p>
</div>
<h3>How your case held up</h3>
<div class="verdict"><b style="font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--rubric)">Score ${ev.score} of ${ev.max}</b><ul>${ev.out.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="row" style="margin-top:24px"><button class="btn quiet" type="button" id="btnAgain">Play again</button></div>
</article>`;
  $('btnAgain').addEventListener('click',()=>{ try{localStorage.removeItem('abbey1526')}catch(e){} renderStart(); });
}
