<style>

<body>

<div class="wrap"><div class="page">
<header class="masthead">
  <h1>the vampire report</h1>
  <span class="sub">moravia, 1755</span>
  <div class="fleurons"></div>
  <button type="button" id="btnRestart" hidden>Start over</button>
</header>
<main class="reading" id="reading"></main>
</div></div>

<script>
(function(){
'use strict';
/* ================================================================== EDITABLE CONTENT
   Everything a teacher might want to change is in this block: the documents, the
   questions, the claims, the cross-checks, the notebook pages, and the report options.
   Each document: id, short name, who (for the portrait caption), src (the source line),
   text (the document), qs (two sourcing questions, each with options; ok:true marks the
   right one; why is the explanation shown after confirmation), claims (each with the
   right answer: obs = observed, inf = inference, hear = hearsay).
   ================================================================================ */
const PART={1:{title:'What has already been said', date:'On the road to Olomouc · three days in a cold coach', ids:['A','B','C'],
  intro:'Three papers from van Swieten’s bag. Two are Habsburg reports from Serbia, thirty years old, printed and reprinted until every reading household in Europe owned a copy. The third is the book a French monk wrote trying to make sense of them. Read them the way the priest of Langendorf read them: as a description of what a vampire looks like when you open the coffin.'},
 2:{title:'The village', date:'Langendorf, Moravia · February 1755', ids:['D','E','F','G','H'],
  intro:'Eleven houses along a frozen stream, a church, a mill, and a black mark on the churchyard wall where the fire was. You take statements in the priest’s front room, one person at a time, with Dr. Gasser writing. Two papers were waiting for you before you arrived: the priest’s letter to his bishop and the district captain’s report to Brno. The five documents describe the same two months and the same grave, and they do not agree.'}};

const SRC=[
 {id:'A', short:'Frombald’s report, 1725', who:'Frombald, Imperial Provisor', real:true,
  src:'<b>Document A.</b> Report of Frombald, Imperial Provisor (the Habsburg civil administrator) of the district of Gradiska, Serbia, to the military administration at Belgrade, 1725. Printed in a Vienna newspaper the same year.',
  text:`<p>In the village of Kisiljevo, a man named Peter Plogojowitz died ten weeks ago and was buried. Within eight days, nine persons, old and young, also died after an illness of twenty-four hours, and each of them declared while still alive that Plogojowitz had come to them in their sleep, laid himself upon them, and throttled them. The widow said that he had come to her and demanded his shoes, and she has since left the village.</p>
<p>The people came to me and demanded that the body be dug up and examined, saying that otherwise the whole village would die as had happened in Turkish times. I told them that such a thing must first be reported to Belgrade, but they answered that they would all leave the village before the reply came. Since I could not stop them, I went with the priest to the grave.</p>
<p>I saw with my own eyes that the body did not smell; that the old skin had peeled off and fresh skin had grown beneath; that the hair, beard, and nails had grown; and that there was fresh blood in the mouth, which by common belief he had sucked from those he killed. The people sharpened a stake and drove it through the heart, and fresh blood flowed from the ears and mouth. Then they burned the body to ashes. I ask that if any fault was committed, it be laid not on me but on the people, who were beside themselves with fear.</p>`,
  qs:[
   {q:'What is Frombald trying to accomplish with this report?', opts:[
     {t:'To report the deaths and ask Belgrade for instructions on how to prevent further exhumations.'},
     {t:'To put on record that he saw the signs himself and that the villagers could not be stopped, so that the blame falls on them and not on him.', ok:true},
     {t:'To warn the authorities in Belgrade that a vampire is loose in the district and more deaths will follow.'}],
    why:'All three are things an official might write. Only the second explains why he says “I saw with my own eyes,” why he records that he told them to wait, and why his last sentence asks that no fault be laid on him. He is covering himself.'},
   {q:'Given his position, which part of his report should a historian trust least?', opts:[
     {t:'The count of nine deaths in eight days.'},
     {t:'His statement that he tried to stop the villagers and could not.', ok:true},
     {t:'The fact that a body was dug up and burned.'}],
    why:'The deaths and the burning happened whether or not he wanted them to; the villagers and the priest could confirm both. His own resistance is the one thing only he vouches for, and it is the thing he most needs to be true.'}],
  claims:[
   {id:'A1', t:'Plogojowitz came to his widow at night and demanded his shoes.', ans:'hear', why:'Frombald did not see this. The widow told it, and she had left the village by the time he wrote.'},
   {id:'A2', t:'Nine people died in Kisiljevo within about eight days.', ans:'obs', why:'Frombald is the administrator and would know the burials. The number is the one hard fact in his report.'},
   {id:'A3', t:'There was fresh blood in Plogojowitz’s mouth when the grave was opened.', ans:'obs', why:'He says he saw it with his own eyes, and he had reason to be precise. What the blood means is a separate question.'},
   {id:'A4', t:'The blood in his mouth was blood he had sucked from the people he killed.', ans:'inf', why:'Frombald himself marks this as “by common belief.” It is the villagers’ conclusion from what they saw.'}]},
 {id:'B', short:'Flückinger’s military report, 1732', who:'Johannes Flückinger, regimental surgeon', real:true,
  src:'<b>Document B.</b> <i>Visum et Repertum</i> (“Seen and Found”), report of Johannes Flückinger, regimental surgeon, with two other army surgeons and two officers, to the military command at Belgrade, 26 January 1732. Reprinted across Europe within months.',
  text:`<p>The hajduks (frontier soldiers) of the village of Medveđa reported that about five years ago a hajduk named Arnold Paole broke his neck falling from a hay wagon. In his lifetime he had often said that near Gossowa in Turkish Serbia he had been troubled by a vampire, and that he had eaten earth from the vampire’s grave and smeared himself with its blood to be free of it. Twenty or thirty days after his death, four people complained of being troubled by him, and they died. The villagers dug him up after forty days and found him, they said, whole and undecayed, with fresh blood flowing from his eyes, nose, mouth, and ears, and the old skin and nails fallen away and new ones grown. They drove a stake through his heart, at which he gave an audible groan and bled copiously, and burned the body.</p>
<p>In the last three months seventeen persons of the village have died, young and old, after illnesses of two or three days. The hajduks say that those who died had eaten the flesh of sheep that Paole had attacked as a vampire, and that a woman named Stana, aged twenty, who died in childbirth, had in life smeared herself with the blood of a vampire to protect herself.</p>
<p>We therefore went to the graveyard and had the bodies dug up, and we found the following. Stana, dead three months: undecayed, with fresh blood in the chest, the organs fresh, and under the old skin a new one. A woman named Miliza, dead ninety days: in the same condition, though the hajduks said she had been thin in life and was now fuller. A child of eight weeks: in the same condition. Several others, dead the same length of time: entirely decomposed. Of the thirteen examined, we found the greater number in the vampire condition, and the hajduks cut off their heads, burned them, and threw the ashes in the river Morava. All this we attest with our signatures.</p>`,
  qs:[
   {q:'What were the surgeons doing, and for whom?', opts:[
     {t:'Setting out to prove to the Belgrade command that vampires exist.'},
     {t:'Writing at the request of the hajduks, who needed official permission to burn the bodies.'},
     {t:'Carrying out an order to find out why frontier soldiers were dying, and reporting both what the hajduks told them and what they examined themselves.', ok:true}],
    why:'The hajduks guarded the Ottoman border; the army wanted to know why they were dying. The report is an official medical examination. The trick is that its first two paragraphs are the hajduks talking and only the third is the surgeons.'},
   {q:'The report carried five signatures and was believed across Europe. What did the signatures actually vouch for?', opts:[
     {t:'That the surgeons had examined Arnold Paole’s body and found it undecayed.'},
     {t:'That what the signers saw in the graveyard in January 1732 was as described; not what the hajduks had told them about 1727.', ok:true},
     {t:'That the report had been checked by the Imperial censors before printing.'}],
    why:'A signature attests to what the signer witnessed. The surgeons witnessed thirteen exhumations. They did not witness Paole’s, which happened five years before they arrived, and they say so: “they said.”'}],
  claims:[
   {id:'B1', t:'Arnold Paole was troubled by a vampire in Turkish Serbia and ate earth from its grave.', ans:'hear', why:'Paole told villagers this years before; the villagers told the surgeons; the surgeons wrote it down. Three steps from anyone who saw anything.'},
   {id:'B2', t:'When Paole was dug up after forty days, fresh blood flowed from his eyes, nose, mouth, and ears.', ans:'hear', why:'The trap in Document B. The surgeons arrived in 1732. Paole was dug up around 1727. Everything about Paole’s body is what the hajduks told them.'},
   {id:'B3', t:'Of the thirteen bodies examined in 1732, some were decomposed and some were not.', ans:'obs', why:'This the surgeons did see and sign for. It is the most reliable statement in the report, and the most interesting: same graveyard, same winter, different results.'},
   {id:'B4', t:'The people who died in 1731 had eaten meat from sheep the vampire had attacked.', ans:'hear', why:'“The hajduks say.” Also worth asking what a sheep “attacked by a vampire” looked like to a farmer: a sick sheep.'},
   {id:'B5', t:'Because Stana’s body was undecayed, she was a vampire.', ans:'inf', why:'The condition of the body is observed. “Vampire” is the conclusion drawn from it, by people who already had the word ready.'}]},
 {id:'C', short:'Calmet’s treatise, 1746', who:'Dom Augustin Calmet, Benedictine', real:true,
  src:'<b>Document C.</b> Dom Augustin Calmet, Benedictine monk and biblical scholar, <i>Dissertation on the Revenants and Vampires of Hungary, Moravia, and Silesia</i>, published in Paris, 1746, and widely read.',
  text:`<p>In this age a new scene presents itself to our eyes. We are told that in Hungary, Moravia, and Silesia, men who have been dead for some months come back, speak, walk, infest villages, suck the blood of their relatives, make them sick, and finally cause their death. The accounts are attested by officers, surgeons, and magistrates, and signed. I confess I do not know how to reconcile them with reason. That a body can leave its grave and return without disturbing the earth is beyond me to explain. Yet so many witnesses of good standing cannot all be mistaken or lying. I set out the facts and leave the judgment to the reader.</p>`,
  qs:[
   {q:'What is Calmet trying to do?', opts:[
     {t:'To mock the credulity of the Hungarians and Moravians for the amusement of Paris.'},
     {t:'To decide, as a scholar and a churchman writing for educated readers, whether reports this well attested can be believed.', ok:true},
     {t:'To warn the French clergy that vampires are spreading westward from the Ottoman frontier.'}],
    why:'He is caught between two things he respects: reason, and signed official documents. He cannot dismiss the reports because of who signed them, and he cannot accept them because of what they say. So he lays them out and hesitates in public.'},
   {q:'What does his hesitation tell you about his readers?', opts:[
     {t:'That French readers in 1746 were ready to laugh at the stories, so he needed the signatures and ranks of the witnesses to justify taking them seriously.', ok:true},
     {t:'That his readers were peasants who already believed in vampires and needed no persuading.'},
     {t:'That the Church had forbidden him to express doubt about the reports.'}],
    why:'A writer defends what his audience will attack. Calmet leans on “officers, surgeons, and magistrates” because his readers, educated Parisians in the age of Voltaire, would otherwise dismiss the whole subject. That is also why van Swieten, nine years later, attacks the signatures first.'}],
  claims:[
   {id:'C1', t:'Officers, surgeons, and magistrates signed the reports from Hungary and Serbia.', ans:'obs', why:'True, and it is why Europe took them seriously. A signature tells you who vouched for a document, not that its contents are correct.'},
   {id:'C2', t:'Men dead for months come back, walk, and suck the blood of their relatives.', ans:'hear', why:'“We are told.” Calmet is in France repeating what the printed reports say, and he says so.'}]},
 {id:'D', short:'The priest’s letter', who:'Father Wenzel Hartmann, parish priest', real:false,
  src:'<b>Document D.</b> Letter of Father Wenzel Hartmann, parish priest of Langendorf, to the Consistory (the bishop’s court) of Olomouc, 20 January 1755, written after the Consistory demanded an explanation.',
  text:`<p>Most Reverend Lords. I write to explain what was done in my parish. In November the widow Rosina Polak died after a long sickness and was buried in consecrated ground. Within a few weeks sickness fell upon the house of the village judge, Georg Beck, and then upon others, and seven of my parishioners have died since Martinmas. The people were in terror and came to me daily, saying that the widow walked at night and that the dead would not stay in their graves.</p>
<p>I resisted them as long as I could. But when the judge and the elders swore before me that the dead woman had been seen, and the whole village threatened to leave the parish, I agreed to an examination so that the people might be calmed, as has been done before in this diocese with the Consistory’s knowledge. The body was opened on 9 January, and all present saw that it showed no sign of corruption, that the face was ruddy, and that there was blood at the mouth. I therefore permitted what the people demanded. Since that day no one in the village has died, and the people are at peace. I did what a shepherd must do for a frightened flock, and I submit myself to your judgment.</p>`,
  qs:[
   {q:'What is Father Wenzel trying to accomplish?', opts:[
     {t:'To ask the Consistory to confirm that such examinations are permitted in the diocese.'},
     {t:'To report the sickness so that the Consistory will send help to the parish.'},
     {t:'To defend himself to his superiors: he resisted, there was precedent, the people forced him, and it worked.', ok:true}],
    why:'He is answering a demand for an explanation, which means he is in trouble. Every sentence does defensive work, including the reminder that the Consistory knew about earlier cases, which quietly spreads the blame upward.'},
   {q:'Which claim in his letter is most convenient for him, and therefore most in need of checking?', opts:[
     {t:'That the widow died in November after a long sickness.'},
     {t:'That since the burning no one in the village has died.', ok:true},
     {t:'That the body was opened on 9 January.'}],
    why:'If the deaths stopped, the burning worked and he is vindicated. It is also the one claim in the letter that a burial register can test. The date of the opening and the date of the death are not in dispute and do not help him either way.'}],
  claims:[
   {id:'D1', t:'The body showed no sign of corruption, the face was ruddy, and there was blood at the mouth.', ans:'obs', why:'He was at the grave and this is what he reports seeing. Observed does not mean correctly understood: compare the surgeon, who stood beside him.'},
   {id:'D2', t:'The widow walked at night and the dead would not stay in their graves.', ans:'hear', why:'“The people… saying that.” He is reporting what frightened parishioners told him, and he says so.'},
   {id:'D3', t:'Seven parishioners died between Martinmas (11 November) and the date of the letter.', ans:'obs', why:'He buried them. The parish priest keeps the burial register, and the district captain’s copy of it gives the same number.'}]},
 {id:'E', short:'The daughter’s statement', who:'Dorothea Polak, aged nineteen', real:false,
  src:'<b>Document E.</b> Statement of Dorothea Polak, aged nineteen, daughter of the dead woman, given to the Imperial commission at Langendorf, 2 February 1755, written down by the commission’s clerk.',
  text:`<p>My mother was sick from the harvest until she died at the beginning of November. She coughed and could not keep food down, and the barber-surgeon bled her twice. She was fifty-one years old. She did not quarrel with anyone except the judge, Georg Beck, over the strip of field by the mill stream, which my father ploughed for thirty years and which the judge says is his. They went before the lord’s steward about it in the summer and the steward decided for the judge.</p>
<p>After my mother died, the judge’s two children fell sick, and then the judge began to say that my mother came to him at night. I never saw anything. In January they dug her up. The ground was frozen and it took the men a whole day. I was not allowed to go near, but my brother says she looked as if she were asleep. They burned her by the wall of the churchyard. We are not allowed to speak of it in the village, and the judge says that if we complain, we will be driven out. I ask the commission to clear my mother’s name, because she was a Christian woman and did no harm to anyone, living or dead.</p>`,
  qs:[
   {q:'What does Dorothea want from the commission?', opts:[
     {t:'To have the field by the mill stream returned to her family.'},
     {t:'To clear her mother’s name, and to make the commission see that the man who accused her mother had a reason to.', ok:true},
     {t:'To have the whole village punished for what was done.'}],
    why:'She says it in her last sentence, and she builds toward it: the long illness (a natural death), the field (a motive for the accuser), the threat (why no one else will say this). She has the strongest personal stake of any witness, which does not make her wrong.'},
   {q:'Her account and the judge’s disagree about almost everything. What do they agree on, and why does it matter?', opts:[
     {t:'That the widow walked at night, which two witnesses agreeing makes very likely.'},
     {t:'That the priest resisted the exhumation.'},
     {t:'That there was a dispute over a field between the two families, which matters because two hostile witnesses agreeing on a fact is the strongest kind of village evidence.', ok:true}],
    why:'The judge brings up the field himself in order to dismiss it. When the person with the most reason to hide a fact confirms it, a historian can treat it as established.'}],
  claims:[
   {id:'E1', t:'Rosina Polak and the judge quarreled over a strip of field before she died.', ans:'obs', why:'Dorothea lived through the dispute, and the judge confirms it. Corroborated by an enemy.'},
   {id:'E2', t:'When they dug her up, she looked as if she were asleep.', ans:'hear', why:'“My brother says.” Dorothea was kept away from the grave and says so herself.'},
   {id:'E3', t:'Her mother was sick from the harvest, coughed, and was bled twice by the barber-surgeon.', ans:'obs', why:'She nursed her mother through it. The barber-surgeon confirms the illness independently.'}]},
 {id:'F', short:'The village judge’s statement', who:'Georg Beck, village judge', real:false,
  src:'<b>Document F.</b> Statement of Georg Beck, village judge (<i>Richter</i>, the headman appointed by the lord) of Langendorf, given to the Imperial commission, 2 February 1755.',
  text:`<p>Everyone knows that the widow Polak was a strange woman who kept to herself and muttered. The matter of the field has nothing to do with it; the steward decided that justly. After she died, my daughter and my son fell sick within the week, with fever and pains in the chest, and I myself woke three nights running with a weight on my chest and could not breathe, and I saw her sitting on me as plainly as I see you. My wife saw her too, at the window. The cowherd’s boy saw her walk past the mill at night. Then the miller’s wife died, and old Hans, and the weaver’s two children, and more.</p>
<p>In my grandfather’s time the same thing happened and it was ended in the same way, and the Consistory did not forbid it. So I went to the priest with the elders and demanded that she be examined. When they opened the coffin, there was blood at her mouth and her cheeks were red. Anyone could see what she was. We did what had to be done, and the dying stopped. If the Vienna gentlemen had been here in January with their children sick, they would have done the same.</p>`,
  qs:[
   {q:'What is Beck trying to accomplish?', opts:[
     {t:'To describe what he and others saw so that the commission can judge for itself.'},
     {t:'To justify what he led the village to do, and to explain the deaths in a way that keeps the field dispute out of it.', ok:true},
     {t:'To shift the blame onto the priest, who gave permission.'}],
    why:'He was the organizer, and he knows it. Notice the order of his sentences: first the widow’s character, then the field dismissed before anyone has raised it, then his sick children. He is answering an accusation nobody has made yet.'},
   {q:'What is his evidence that the dead woman walked?', opts:[
     {t:'The sworn testimony of the village elders before the priest.'},
     {t:'His own dream, his wife at a window at night, and a boy who works for him.', ok:true},
     {t:'The barber-surgeon’s examination of the body.'}],
    why:'Every witness to the walking is in his household or under his authority. The elders swore that she “had been seen,” which is to say they swore to what Beck told them.'}],
  claims:[
   {id:'F1', t:'Beck’s children fell sick because the dead woman visited them.', ans:'inf', why:'The sickness is a fact; the cause is the judge’s conclusion. The district captain’s table offers another cause: the same fever in three villages.'},
   {id:'F2', t:'Rosina Polak was a strange woman who kept to herself and muttered.', ans:'hear', why:'“Everyone knows.” This is how a village describes a person after it has decided what she was.'},
   {id:'F3', t:'The cowherd’s boy saw her walk past the mill at night.', ans:'hear', why:'Beck did not see it; the boy told him, or told someone who told him.'},
   {id:'F4', t:'When the coffin was opened there was blood at her mouth and her cheeks were red.', ans:'obs', why:'He was there and this is what he saw. Three people at the grave report three versions of the same body; observed is not the same as understood.'}]},
 {id:'G', short:'The barber-surgeon’s statement', who:'Johann Krause, barber-surgeon', real:false,
  src:'<b>Document G.</b> Statement of Johann Krause, barber-surgeon of Langendorf (a tradesman who bleeds patients, pulls teeth, and sets bones), given to the Imperial commission, 3 February 1755.',
  text:`<p>I attended the widow in her illness. She had a wasting cough from the autumn and died of it; I have seen many go the same way. I was present when the coffin was opened on 9 January, because the judge wished me to be. The body had been two months in ground that was frozen hard from Advent onward. It was stiff with cold. The skin of the face and hands was peeling, as it does, and the flesh beneath looked pink where it showed. There was a dark fluid at the mouth and nose. The nails stood out because the skin had shrunk back from them. I have seen all of this before in bodies dug up for other reasons, and so has anyone who has worked in a churchyard in winter. There was a smell, though less than in summer.</p>
<p>I said none of this at the time. There were sixty people around the grave with torches and the judge had already said what they would find. I say it now because the commission asks me under oath.</p>`,
  qs:[
   {q:'Why does Krause say now what he did not say in January?', opts:[
     {t:'He has since learned from the Vienna physicians what he was supposed to have seen.'},
     {t:'He was afraid of the crowd and the judge in January, and now he is answering the Empress’s commission under oath.', ok:true},
     {t:'He wants to be revenged on the judge for forcing him to attend.'}],
    why:'He gives the reason himself, and it is believable: sixty people with torches, and the most powerful man in the village having announced the result in advance. The first option is a real possibility a careful reader should consider, but nothing in his statement depends on medical learning; a gravedigger could have said it.'},
   {q:'What makes him more useful than the priest or the judge, and what is his weakness?', opts:[
     {t:'He is a university-trained physician whose word outranks theirs.'},
     {t:'He has handled dead bodies before and has no stake in the quarrel, but he kept silent when it would have mattered.', ok:true},
     {t:'He is the daughter’s witness, so he confirms her account.'}],
    why:'A barber-surgeon is a tradesman, not a physician, and his value here is experience, not rank. He also has nothing to gain from either family. His silence in January is the thing a hostile reader would use against him.'}],
  claims:[
   {id:'G1', t:'The skin of the face and hands was peeling, the flesh beneath looked pink, and there was a dark fluid at the mouth and nose.', ans:'obs', why:'He stood at the grave. This is the same body the priest and the judge describe, seen by someone who had seen bodies before.'},
   {id:'G2', t:'The widow died of a wasting cough.', ans:'inf', why:'He treated her and watched her die, but “died of” is a diagnosis: his conclusion from the symptoms, not something he could see.'},
   {id:'G3', t:'The judge had already said what they would find before the coffin was opened.', ans:'obs', why:'Krause was there and heard it. It is also the detail that explains why sixty people saw a vampire.'}]},
 {id:'H', short:'The district captain’s report', who:'The Kreishauptmann, district captain', real:false,
  src:'<b>Document H.</b> Report of the <i>Kreishauptmann</i> (the Imperial district captain, a civil official) at Olomouc to the provincial government at Brno, 28 January 1755, with a table attached.',
  text:`<p>I report that I was not informed of the proceeding at Langendorf until after the burning, and that neither the lord’s steward nor the parish gave notice to this office, as the regulations require. On inquiry I find the following, from the parish registers of burials, which I have had copied:</p>
<p>Langendorf: deaths from 11 November to 9 January, seven; from 9 January to this date, one (a child, 22 January). Neighboring parish of Neudorf, where no exhumation took place: deaths in the same period, five, and two more since 9 January. Parish of Steinbach, no exhumation: six, and one since. The physician of the district reports a catarrhal fever with pain in the chest in all three villages since the autumn, which carried off chiefly the old and the very young.</p>
<p>I submit that the matter be taken from the parish and that the clergy be instructed that no grave may be opened without the knowledge of this office.</p>`,
  qs:[
   {q:'What is the district captain trying to accomplish?', opts:[
     {t:'To ask Brno to send a physician to treat the fever in the three villages.'},
     {t:'To defend the priest against the commission by showing that the deaths were natural.'},
     {t:'To show his superiors that he was bypassed, that the fault lies with the clergy and the steward, and that such cases should be under his office in future.', ok:true}],
    why:'His first sentence is about who failed to inform him, and his last is a request for authority. Between them is the evidence. He is a civil official in a contest with the Church over who decides, which is the contest the Empress is about to settle.'},
   {q:'Why is his table worth more than any eyewitness at the grave?', opts:[
     {t:'Because he outranks the priest and the judge, so his account takes precedence.'},
     {t:'Because it counts deaths in villages where nothing was done, which lets you test whether the burning changed anything.', ok:true},
     {t:'Because it proves that the widow was innocent.'}],
    why:'Langendorf alone tells you nothing: deaths fell after the burning, as the priest says. Neudorf and Steinbach, where deaths also fell and no one was burned, tell you why. The table is the only document in the file with a comparison in it.'}],
  claims:[
   {id:'H1', t:'The deaths at Langendorf were part of a fever that also struck neighboring villages.', ans:'obs', why:'He copied the burial registers of three parishes. Counting is observing.'},
   {id:'H2', t:'The fever was a catarrhal fever with pain in the chest.', ans:'inf', why:'The district physician’s diagnosis, which is a trained conclusion from symptoms. Good inference is still inference.'},
   {id:'H3', t:'A child died in Langendorf on 22 January, thirteen days after the burning.', ans:'obs', why:'From the burial register, which the priest himself keeps. It is the sentence that undoes the priest’s letter.'}]},
];

const NB=[
 {id:'n1', title:'Blood at the mouth', need:['A3','A4','D1'], text:'Van Swieten’s explanation, from his report of 1755: after death the body produces gases as it decays; the gases push fluid from the lungs and stomach into the mouth and nose. This “fresh blood” is dark, and it is found in bodies that no one has ever accused of anything. The redness of the face is the same fluid settling in the skin.'},
 {id:'n2', title:'New skin, long nails', need:['B3','B5','G1'], text:'The outer skin loosens and slips off some weeks after death; the skin beneath is pink and looks new. The skin at the fingertips shrinks back, so the nails look longer. The hair does not grow. Whether a body decays in two months depends on the cold, the soil, the coffin, and the illness, which is why thirteen bodies from one graveyard gave the surgeons two results.'},
 {id:'n3', title:'How a story travels', need:['A1','B1','B4','F2'], text:'In each report the most dramatic details are the ones the writer did not see: the widow and the shoes, Paole eating grave earth, the sheep, the muttering widow. A document can be entirely honest and still be mostly hearsay. The DBQ word for noticing this is sourcing: asking of every sentence, who saw this?'},
 {id:'n4', title:'What a fever does', need:['A2','F1','H1','H3'], text:'The sequence in all three villages is the same: an autumn sickness, a cluster of deaths among the old and the very young, a frightening dream in a grieving household, a name, a grave. Then the deaths slow, because epidemics slow. If a body has been burned in the meantime, the burning gets the credit. The district captain’s table is the only document that lets you see this, because it is the only one that looked at a village where nothing was done.'},
 {id:'n5', title:'Who signs, and who counts', need:['C1','E1','B2'], text:'The Serbian reports carried five signatures and were believed across Europe for twenty years, though the signers never saw the body the story is about. The village quarrel over a field is confirmed by two enemies. Credibility comes from the position of the witness and whether someone with a different interest agrees, not from the rank of the person signing.'},
];

function portrait(id,size){ size=size||92; return `<svg class="port" viewBox="0 0 100 120" width="${size}" height="${Math.round(size*1.2)}" aria-hidden="true"><ellipse cx="50" cy="60" rx="46" ry="56" fill="#E6D8B5" stroke="#121212" stroke-width="1.2"/><ellipse cx="50" cy="60" rx="42" ry="52" fill="none" stroke="#121212" stroke-width=".5"/><clipPath id="clip_${id}_${size}"><ellipse cx="50" cy="60" rx="42" ry="52"/></clipPath><g clip-path="url(#clip_${id}_${size})" fill="#121212">${SIL[id]||SIL.A}</g></svg>`; }

/* checking happens one document (or the cross-check section) at a time: all items in it must be answered; the correct ones are confirmed, the rest stay open to be changed */
function docAnswered(id){ const d=SRCMAP[id]; return d.qs.every((q,i)=>S.srcAns[sq(id,i)]!==undefined) && d.claims.every(c=>S.claims[c.id]!==undefined); }
function unlockNotebook(){ const u=[]; NB.forEach(p=>{ if(!S.nb[p.id] && p.need.every(k=>S.locked[k])){ S.nb[p.id]=true; u.push(p.title); } }); return u; }
function checkDoc(id){
  const d=SRCMAP[id]; let ok=0, bad=0;
  d.qs.forEach((q,i)=>{ const k=sq(id,i); if(S.lockedSrc[k]) return; if(q.opts[S.srcAns[k]].ok){ S.lockedSrc[k]=true; ok++; } else bad++; });
  d.claims.forEach(c=>{ if(S.locked[c.id]) return; if(S.claims[c.id]===c.ans){ S.locked[c.id]=true; ok++; } else bad++; });
  S.checks[id]=(S.checks[id]||0)+1;
  const u=unlockNotebook();
  S.flash = (bad===0 ? `Van Swieten reads your notes on Document ${id} and hands them back without a mark. All of it stands.` : `Van Swieten reads your notes on Document ${id}. ${ok} he agrees with. ${bad} he has circled: “Look again.” Reread the document, change the circled answers, and hand it back.`) + (u.length?` That night he writes a page in his notebook: “${u.join('”, “')}”.`:'');
}
function checkX(){
  let ok=0, bad=0;
  XCHECK.forEach(x=>{ if(S.lockedX[x.id] || S.x[x.id]===undefined) return; if(S.x[x.id]===x.ok){ S.lockedX[x.id]=true; ok++; } else bad++; });
  S.checks.X=(S.checks.X||0)+1;
  S.flash = bad===0 ? 'Van Swieten agrees with every comparison you made.' : `Van Swieten agrees with ${ok} of your comparisons and has circled ${bad}. Look again.`;
}
const nLocked=()=>Object.keys(S.locked).length, nLockedSrc=()=>Object.keys(S.lockedSrc).length, nLockedX=()=>Object.keys(S.lockedX).length;
const nSrcQ=SRC.reduce((a,s)=>a+s.qs.length,0);
function partDone(p){ return PART[p].ids.every(id=>SRCMAP[id].qs.every((q,i)=>S.srcAns[sq(id,i)]!==undefined) && SRCMAP[id].claims.every(c=>S.claims[c.id]!==undefined)); }

function go(scene,resuming){
  S.scene=scene; btnRestart.hidden=false; save();
  if(scene==='brief') renderBrief();

  else renderStart();
  if(!resuming) window.scrollTo({top:0,behavior:'auto'});

function sourced(id){ return SRCMAP[id].qs.every((q,i)=>S.lockedSrc[sq(id,i)]); }
function evaluate(){
  const r=S.report, out=[]; let score=0;
  const T=THESES.find(x=>x.id===r.th);
  if(r.th==='fever'){ out.push('Your conclusion is the one van Swieten reached, and it is the one the documents support once they are sourced: the only counted evidence (H) and the only witness at the grave with no stake in the story (G) both point to a fever and a cold grave.'); score+=2; }
  else if(r.th==='open'){ out.push('Your conclusion treats the priest’s and the judge’s accounts as equal to the surgeon’s and the burial register. It gives weight to “many saw it” without asking what each of them wanted to see. Van Swieten would have sent it back.'); }
  else { out.push('Your conclusion skips the question you were sent to answer. Punishing the village does not tell the Empress whether her officials or her priests should handle the next case, or why the signs at the grave were misread.'); }
  r.docs.forEach(d=>{
    const s=SRCMAP[d]; const fits=T.fits.includes(d);
    if(fits){ out.push(`Document ${d} (${s.short}) supports your conclusion.`+(sourced(d)?' You also had its author’s purpose right, which is the sourcing point.':' You had not worked out its author’s purpose, so you are citing it without saying why it can be trusted.')); score+= sourced(d)?1:0.5; }
    else { out.push(`Document ${d} (${s.short}) does not support your conclusion`+(r.th==='fever'&&(d==='D'||d==='F')?', unless you cite it as an example of what the villagers believed, which is a legitimate use but not the one you chose.':'.')); }
  });
  if(r.docs.length===0){ out.push('You cited nothing. A conclusion with no documents is an opinion.'); }
  if(r.th==='fever' && !r.docs.includes('H')){ out.push('You left out Document H, the burial registers of three villages. It is the only document that shows the deaths continuing where no one was burned, and the only one that cannot be explained by what someone wanted to see.'); }
  if(r.th==='fever' && !r.docs.includes('G')){ out.push('You left out Document G, the surgeon. He is the one witness at the grave with no interest in the story and some knowledge of bodies.'); }
  if(r.rec==='civil'){ out.push('Your recommendation is the one Maria Theresa issued on 1 March 1755: exhumations forbidden without civil permission, bodies to be examined by physicians, the clergy removed from the matter, and the belief named as superstition.'); score+=1; }
  else if(r.rec==='church'){ out.push('Your recommendation leaves the next case with the people who handled this one. The Empress was not asking how to handle vampires; she was asking how to make sure her government, not the parish, decides.'); }
  else { out.push('Your recommendation punishes and changes nothing. The priest had precedent and the judge had sixty people behind him; the next village will do the same unless the rule changes.'); }
  return {out, score, max:7};
}
function recordText(){
  const r=S.report;
  const firstC=CLAIMS.filter(c=>S.locked[c.id] && S.claimTries[c.id]===1).length;
  const firstS=Object.keys(S.lockedSrc).filter(k=>S.srcTries[k]===1).length;
  const s=`THE VAMPIRE REPORT — RUN RECORD\nClaims confirmed: ${nLocked()}/${CLAIMS.length} (${firstC} on first try) · Sourcing questions confirmed: ${nLockedSrc()}/${nSrcQ} (${firstS} on first try) · Cross-checks: ${nLockedX()}/${XCHECK.length} · Notebook pages: ${Object.keys(S.nb).length}/${NB.length}\nChecks per document: ${SRC.map(d=>d.id+':'+(S.checks[d.id]||0)).join(' ')} X:${S.checks.X||0}\nThesis: ${r.th} · Cited: ${r.docs.join(', ')||'none'} · Recommendation: ${r.rec}`;
  return s+`\nRecord code: ${hash(s+JSON.stringify(S.claimTries)+JSON.stringify(S.srcTries))}`;
}
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'V-'+(Math.abs(h)%46656).toString(36).toUpperCase().padStart(3,'0'); }

function renderEnd(){

  const ev=evaluate(); const rec=recordText();
  const missedC=CLAIMS.filter(c=>!S.locked[c.id]);
  reading.innerHTML=`<article class="scene ending fade">
<p class="date">Vienna · March 1755</p>
<h2>What the Empress did</h2>
<div class="who">You were assistant to Gerard van Swieten, physician to the Empress</div>
<div class="portrow">${portrait('V',110)}<div class="body">
<p>Van Swieten read the file and wrote his own report, in French, for the Empress. He went through the signs one by one: the blood at the mouth, the pink skin, the long nails, the undecayed body in winter ground, and gave the ordinary explanation for each. He called the belief “the darkness of ignorance,” and he was angrier at the priest than at the villagers.</p>
<p>On 1 March 1755 Maria Theresa issued a decree for all her lands. No grave was to be opened for suspicion of vampirism, and no body burned, without the permission of the civil authorities, after examination by a physician. The clergy were forbidden to take part. The belief itself was declared superstition, and “posthumous magic” was removed from the things a court could consider. The priest at the real village was reprimanded; the villagers were not prosecuted. From then on, when a village in the Habsburg lands dug up a body, the person who arrived was a district official with a doctor, not a soldier with a stake.</p>
</div></div>
<h3>How van Swieten read your report</h3>
<div class="verdict"><b style="letter-spacing:.14em;text-transform:uppercase;font-size:13px">Score ${ev.score} of ${ev.max}</b><ul>${ev.out.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<h3>Three state responses, thirty years apart</h3>
<ul class="tl">
<li><b>1725</b> Kisiljevo, Serbia. A civil official watches villagers stake and burn a body because he cannot stop them, then writes to Belgrade to say it was not his fault.</li>
<li><b>1732</b> Medveđa, Serbia. The army sends surgeons, who dig up thirteen bodies, examine them, sign a report, and let the soldiers cut off the heads. The state does the work itself and calls it medicine.</li>
<li><b>1755</b> Moravia. The Empress sends her physician, who explains the signs, and she forbids the practice by decree. The state takes the matter away from villages and priests and gives it to officials and doctors.</li>
</ul>
<p style="font-size:17px">The signs on the bodies did not change between 1725 and 1755. What changed was who the state sent to look at them, and what that person was trained to see. That is the change-over-time argument hidden in this file, and it is a good one for an essay on enlightened absolutism: the Habsburg state got stronger not only by collecting taxes and raising armies, but by deciding what counted as evidence.</p>
${missedC.length?`<h3>Notes he never agreed with</h3><ul class="factors">${missedC.map(c=>`<li><b style="font-weight:400">${c.s}:</b> ${c.t} <i style="color:var(--ink-soft)">(${ANS[c.ans].toLowerCase()}: ${c.why})</i></li>`).join('')}</ul>`:'<h3>He agreed with every note</h3><p style="font-size:17px">Every claim in the file was sorted correctly before you wrote to the Empress.</p>'}
<h3>Your run record</h3>
<p style="font-size:17px;color:var(--ink-soft)">Copy this into your assignment if your teacher asks for it.</p>
<div class="recordbox" id="recBox">${esc(rec)}</div>
<div class="row"><button class="btn" type="button" id="btnCopy">Copy record</button><span class="toast" id="toast"></span></div>
<div class="row"><button class="btn quiet" type="button" id="btnAgain">Play again</button></div>
<div class="after">
<h3>What is real, and what is invented</h3>
<p>Documents A, B, and C are close paraphrases of the real texts: Frombald’s 1725 report, printed in the <i>Wienerisches Diarium</i>; Flückinger’s <i>Visum et Repertum</i> of January 1732; and Calmet’s 1746 <i>Dissertation</i>. The dates, numbers, and details in them (the shoes, the sheep, the thirteen bodies, Stana’s age) are from the originals. The Moravian case of 1755 is real: in the village of Hermersdorf near Olomouc, a woman named Rosina Polakin was exhumed and burned in January 1755, the Consistory had approved similar acts before, van Swieten and Gasser investigated, and the decree of 1 March 1755 followed. The village of Langendorf, the field dispute, and documents D through H are invented so that the five statements would have clear and different interests to read. The surgeon’s description of the body is what van Swieten’s own report says such bodies look like. The district captain’s table of three villages is invented; it is the kind of evidence van Swieten used, put into a form you could count. The portraits are in the style of the cut-paper silhouettes that became fashionable in exactly these years; none is a likeness.</p>
<h3>Why this is in a history class</h3>
<p>This is the Enlightenment arriving by decree. Maria Theresa was no philosophe; she was a devout Catholic who disliked Voltaire. But she ran a state that needed its officials to decide things, and van Swieten, a doctor trained in Leiden, was reorganizing her universities around observation and anatomy. The vampire decree is a small example of the pattern historians call enlightened absolutism: a ruler using royal power to impose rational administration on local custom and on the Church. Compare it with the 1682 French edict on poisoners and “pretended magic” and with the end of the witch trials in the Empire: in each case the hunts stopped when the state redefined what a court was allowed to believe.</p>
<p class="sources">Sources: Gerard van Swieten, <i>Remarques sur le vampyrisme de Silésie de l’an 1755</i>; Augustin Calmet, <i>Dissertation sur les revenants en corps… et les vampires</i> (1746); the 1725 and 1732 reports as printed in Paul Barber, <i>Vampires, Burial, and Death</i> (1988); Gábor Klaniczay, “The Decline of Witches and the Rise of Vampires in 18th-Century Habsburg Monarchy,” <i>Ethnologia Europaea</i> (1987); Koen Vermeir, “Vampires as Creatures of the Imagination” (2012).</p>
