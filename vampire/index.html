  pane.querySelectorAll('.q input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ S.srcAns[r.name]=+r.value; S.srcTries[r.name]=(S.srcTries[r.name]||0)+1; save(); r.closest('.q').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked)); refreshNav(); }));
  pane.querySelectorAll('.claim input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ S.claims[r.name]=r.value; S.claimTries[r.name]=(S.claimTries[r.name]||0)+1; save(); r.closest('.claim').querySelectorAll('.ans label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked)); refreshNav(); }));
  $('btnCheck').addEventListener('click',()=>{ sfx('quill'); checkDoc(id); save(); renderWork(true); });
  const nd=$('btnNextDoc'); if(nd) nd.addEventListener('click',()=>{ S.open[key]=next; save(); renderWork(); });
  const pd=$('btnPrevDoc'); if(pd) pd.addEventListener('click',()=>{ S.open[key]=prev; save(); renderWork(); });
  const pp=$('btnPrevPart'); if(pp) pp.addEventListener('click',()=>{ S.tab='p1'; save(); renderWork(); });
  const np=$('btnNextPart'); if(np) np.addEventListener('click',()=>{ S.tab=p===1?'p2':'x'; save(); renderWork(); });
}

function renderX(pane){
  pane.innerHTML=`<div class="dlg"><span class="sp">Dr. Gasser</span>They cannot all be telling the truth. Lay the documents side by side and see which ones support each other.</div><p class="prog">Six questions that need two documents at once. Go back to the old reports or the statements if you need to reread one.</p>
<div class="row" style="margin:0 0 14px"><button class="btn quiet" type="button" id="btnBackX">Back to the statements</button><button class="btn" type="button" id="btnCheckX" ${Object.keys(S.x).length?'':'disabled'}>Hand your comparisons to van Swieten</button></div>
${XCHECK.map(x=>{ const a=S.x[x.id], lk=!!S.lockedX[x.id]; const wr=!lk && S.checks.X && a!==undefined; return `<div class="claim${lk?' lock':''}${wr?' wrong':''}">${lk?'<span class="lockmark">he agrees</span>':(wr?'<span class="lockmark notyet">struck out</span>':'')}<p class="ct">${x.q}</p><div class="ans">${x.opts.map(o=>`<label class="${a===o?(lk?'lk':'sel'):''}"><input type="radio" name="${x.id}" value="${esc(o)}" ${a===o?'checked':''} ${lk?'disabled':''}>${SRCMAP[o]?'Document '+o+' · '+SRCMAP[o].short:o}</label>`).join('')}</div></div>`; }).join('')}`;
  pane.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ S.x[r.name]=r.value; S.xTries[r.name]=(S.xTries[r.name]||0)+1; save(); r.closest('.claim').querySelectorAll('.ans label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked)); refreshNav(); }));
  $('btnCheckX').addEventListener('click',()=>{ sfx('quill'); checkX(); save(); renderWork(true); });
  $('btnBackX').addEventListener('click',()=>{ S.tab='p2'; save(); renderWork(); });
}

function youRow(){ const seen=S.seen||[], heard=S.heard||[]; if(!seen.length&&!heard.length) return ''; const L=a=>a.length?`<ul>${a.map(t=>`<li>${t}</li>`).join('')}</ul>`:'<span class="empty">—</span>'; return `<tr><td>You, in the village</td><td>${L(seen)}</td><td><span class="empty">—</span></td><td>${L(heard)}</td><td>The report for the Empress</td></tr>`; }
function ledgerHTML(){
  const rows=SRC.filter(d=>d.claims.some(c=>S.locked[c.id]) || S.lockedSrc[sq(d.id,0)]);
  if(!rows.length && !(S.seen&&S.seen.length) && !(S.heard&&S.heard.length)) return `<p class="ledgercap">The ledger is empty. It fills as van Swieten agrees with your notes: what each writer saw, what he worked out, what he only heard said, and what he wanted from his reader.</p>`;
  const cell=(d,k)=>{ const L=d.claims.filter(c=>S.locked[c.id]&&c.ans===k); return L.length?`<ul>${L.map(c=>`<li>${c.t}</li>`).join('')}</ul>`:'<span class="empty">—</span>'; };
  const purpose=d=>{ const k=sq(d.id,0); return S.lockedSrc[k]?d.qs[0].opts[S.srcAns[k]].t:'<span class="empty">—</span>'; };
  return `<p class="ledgercap">Kept by the commission’s clerk. Only what van Swieten has agreed with is entered.</p>
<table class="ledger"><thead><tr><th>Document</th><th>Seen</th><th>Worked out</th><th>Heard said</th><th>What the writer wanted</th></tr></thead>
<tbody>${rows.map(d=>`<tr><td>${d.id} · ${d.who}</td><td>${cell(d,'obs')}</td><td>${cell(d,'inf')}</td><td>${cell(d,'hear')}</td><td>${purpose(d)}</td></tr>`).join('')}${youRow()}</tbody></table>`;
}
function renderNotebook(pane){
  const letters=LETTERS.filter(L=>S.letters[L.id]);
  pane.classList.add('pageturn'); setTimeout(()=>pane.classList.remove('pageturn'),800);
  pane.innerHTML=`<p class="prog">He writes in it at night after reading your notes. You may read what he has written so far. A page appears once he has agreed with the claims it depends on.</p>
<h4 class="sect" style="margin-top:6px">The ledger</h4>
${ledgerHTML()}
<h4 class="sect">His pages</h4>
${NB.map(p=>S.nb[p.id]?`<div class="nb"><h4>${p.title}</h4><p>${p.text}</p></div>`:`<div class="nb off"><h4>${p.title}</h4><p>Nothing written yet. He is waiting on your notes for claims ${p.need.join(', ')}.</p></div>`).join('')}
${letters.length?`<h4 class="sect">Letters received</h4>${letters.map(L=>letterHTML(L,false)).join('')}`:''}`;
}

/* ================================================================== report */
function renderReport(){
  mood('report');
  const dr=S.draft||{}; let th=dr.th||null, rec=dr.rec||null; const att=new Set(dr.docs||[]);
  reading.innerHTML=`<article class="scene fade">
<p class="date">Olomouc · 10 February 1755</p>
<h2>Report to the Empress</h2>
<div class="who">You are assistant to Gerard van Swieten, physician to the Empress</div>
<div class="dlg"><span class="sp">Van Swieten</span>Her Majesty reads one page. Give me one sentence I can defend, the documents that support it, and what she should order. I will sign it.</div>
<h3>1. The dead woman</h3>
<p style="font-size:16px;color:var(--ink-soft)">Her name, as it should appear in the record. It is in the file.</p>
<input type="text" id="deadName" class="nameinput" autocomplete="off" spellcheck="false" placeholder="Name">
<h3>2. Your conclusion</h3>
${THESES.map(x=>`<label class="opt"><input type="radio" name="th" value="${x.id}">${x.t}</label>`).join('')}
<h3>3. The documents behind it</h3>
<p style="font-size:16px;color:var(--ink-soft)">Choose up to four. Van Swieten will check whether each one supports your sentence, and whether you worked out who wrote it and why.</p>
<div id="atts">${SRC.map(s=>`<label class="att"><input type="checkbox" value="${s.id}">${portrait(s.id,34)}<span><b style="font-weight:400">Document ${s.id}.</b> ${s.short} <i style="color:var(--ink-soft)">(${s.who})</i></span></label>`).join('')}</div>
<h3>4. What she should order</h3>
${RECS.map(x=>`<label class="opt"><input type="radio" name="rec" value="${x.id}">${x.t}</label>`).join('')}
<div class="row" style="margin-top:22px"><button class="btn quiet" type="button" id="btnBackFile">Back to the file</button><button class="btn" type="button" id="btnSend" disabled>Send the report</button><span class="toast" id="warn">Choose a conclusion and what she should order.</span></div>
</article>`;
  const upd=()=>{ $('btnSend').disabled=!(th&&rec); $('warn').textContent=(th&&rec)?(att.size?'':'You are sending a sentence with no documents behind it.'):'Choose a conclusion and what she should order.'; reading.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked)); };
  reading.querySelectorAll('input[name=th]').forEach(r=>r.addEventListener('change',()=>{ th=r.value; upd(); }));
  reading.querySelectorAll('input[name=rec]').forEach(r=>r.addEventListener('change',()=>{ rec=r.value; upd(); }));
  reading.querySelectorAll('#atts input').forEach(c=>c.addEventListener('change',()=>{ if(c.checked){ if(att.size>=4){ c.checked=false; return; } att.add(c.value);} else att.delete(c.value); upd(); }));
  if(dr.name) $('deadName').value=dr.name;
  reading.querySelectorAll('input[name=th]').forEach(r=>{ if(r.value===th) r.checked=true; });
  reading.querySelectorAll('input[name=rec]').forEach(r=>{ if(r.value===rec) r.checked=true; });
  reading.querySelectorAll('#atts input').forEach(c=>{ if(att.has(c.value)) c.checked=true; });
  upd();
  $('btnBackFile').addEventListener('click',()=>{ S.draft={th,rec,docs:[...att],name:($('deadName').value||'').trim()}; save(); go('work'); });
  $('btnSend').addEventListener('click',()=>{ S.draft=null; const nm=($('deadName').value||'').trim(); S.report={th,rec,docs:[...att],name:nm,nameOk:DEAD_WOMAN.includes(nm.toLowerCase().replace(/\s+/g,' '))}; S.ended=true; save(); seal(()=>go('roadback')); });
}
function seal(then){ const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; if(reduce){ then(); return; }
  const art=reading.querySelector('article'); if(!art){ then(); return; }
  reading.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  art.style.height=art.offsetHeight+'px'; void art.offsetHeight; art.classList.add('folding'); window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{ const w=document.createElement('div'); w.className='sealwrap'; w.innerHTML='<div class="seal">S</div>'; reading.appendChild(w); const c=document.createElement('p'); c.className='sealcap'; c.textContent='Sealed. It goes to Vienna by the morning post.'; reading.appendChild(c); sfx('quill'); },950);
  setTimeout(then, 2600);
}

/* ================================================================== evaluation and ending */
function sourced(id){ return SRCMAP[id].qs.every((q,i)=>S.lockedSrc[sq(id,i)]); }
function evaluate(){
  const r=S.report, out=[]; let score=0;
  const T=THESES.find(x=>x.id===r.th);
  if(r.th==='fever'){ out.push('Your conclusion is the one van Swieten reached. Once the documents are sourced it is the only one they support: the single count in the file (I) and the one witness at the grave with nothing to gain (H) both point to a fever and a cold grave.'); score+=2; }
  else if(r.th==='open'){ out.push('Your conclusion treats the priest’s and the judge’s accounts as equal to the surgeon’s and the burial register. It accepts “many saw it” without asking what each of them expected to see. Van Swieten would have sent it back.'); }
  else { out.push('Your conclusion avoids the question you were sent to answer. Punishing the village does not tell the Empress whether her officials or her priests should handle the next case, or why sixty people misread a body.'); }
  r.docs.forEach(d=>{
    const sdoc=SRCMAP[d]; const fits=T.fits.includes(d);
    if(fits){ out.push(`Document ${d} (${sdoc.short}) supports your conclusion.`+(sourced(d)?' You also worked out why its author wrote it, which is the sourcing point.':' You had not worked out why its author wrote it, so you are citing it without being able to say why it should be trusted.')); score+= sourced(d)?1:0.5; }
    else { out.push(`Document ${d} (${sdoc.short}) does not support your conclusion`+(r.th==='fever'&&(d==='E'||d==='G')?', unless you cite it as evidence of what the villagers believed. That is a legitimate use, but it is not the one you chose.':'.')); }
  });
  if(r.docs.length===0){ out.push('You cited nothing. A conclusion with no documents behind it is an opinion.'); }
  if(r.th==='fever' && !r.docs.includes('I')){ out.push('You left out Document I, the burial registers of three villages. It is the only document that shows the deaths continuing where nobody was burned, and the only one that cannot be explained by what a witness wanted to see.'); }
  if(r.th==='fever' && !r.docs.includes('H')){ out.push('You left out Document H, the barber-surgeon. He is the one witness at the grave with no interest in the outcome and some experience of bodies.'); }
  if(r.rec==='civil'){ out.push('Your recommendation is the one Maria Theresa issued on 1 March 1755: no exhumation without civil permission, bodies to be examined by physicians, the clergy kept out of it, and the belief named as superstition.'); score+=1; }
  else if(r.rec==='church'){ out.push('Your recommendation leaves the next case with the people who handled this one. The Empress was not asking how to deal with vampires. She was asking how to make sure that her government, and not the parish, decides.'); }
  else { out.push('Your recommendation punishes and changes nothing. The priest had precedent and the judge had sixty people behind him. The next village will do the same unless the rule changes.'); }
  if(r.nameOk){ out.push('You entered her name in the report: Rosina Polak. It appears in two of the village documents and in none of the documents that reached Vienna before you.'); }
  else { out.push('Her name was Rosina Polak. It is in the priest’s letter and the daughter’s statement. It did not appear in your report.'); }
  return {out, score, max:7};
}
function recordText(){
  const r=S.report;
  const firstC=CLAIMS.filter(c=>S.locked[c.id] && S.claimTries[c.id]===1).length;
  const firstS=Object.keys(S.lockedSrc).filter(k=>S.srcTries[k]===1).length;
  const s=`THE VAMPIRE REPORT — RUN RECORD\nClaims confirmed: ${nLocked()}/${CLAIMS.length} (${firstC} on first try) · Sourcing questions confirmed: ${nLockedSrc()}/${nSrcQ} (${firstS} on first try) · Cross-checks: ${nLockedX()}/${XCHECK.length} · Notebook pages: ${Object.keys(S.nb).length}/${NB.length}\nChecks per document: ${SRC.map(d=>d.id+':'+(S.checks[d.id]||0)).join(' ')} X:${S.checks.X||0}\nThesis: ${r.th} · Cited: ${r.docs.join(', ')||'none'} · Recommendation: ${r.rec}`;
  return s+`\nRecord code: ${hash(s+JSON.stringify(S.claimTries)+JSON.stringify(S.srcTries))}`;
}
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'V-'+(Math.abs(h)%46656).toString(36).toUpperCase().padStart(3,'0'); }

function renderEnd(){
  S.ended=true; save();
  const ev=evaluate(); const rec=recordText();
  const missedC=CLAIMS.filter(c=>!S.locked[c.id]);
  mood('end');
  const reply0=REPLIES.find(r=>ev.score>=r.min)||REPLIES[REPLIES.length-1]; const reply=Object.assign({},reply0,{text:reply0.text.replace('{NAME}', S.report.nameOk?NAME_LINES.found:NAME_LINES.missing)});
  reading.innerHTML=`<article class="scene ending fade">
<p class="date">Vienna · March 1755</p>
<h2>The reply</h2>
<div class="who">You were assistant to Gerard van Swieten, physician to the Empress</div>
${letterHTML(reply,true)}
<h3>How van Swieten read your report</h3>
<div class="verdict"><b style="letter-spacing:.14em;text-transform:uppercase;font-size:13px">Score ${ev.score} of ${ev.max}</b><ul>${ev.out.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<h3>What the Empress did</h3>
<div class="portrow">${portrait('V',110)}<div class="body">
<p>Van Swieten read the file and wrote his own report for the Empress, in French. He took the signs one at a time: the blood at the mouth, the pink skin, the long nails, the undecayed body in winter ground, and gave the ordinary explanation for each. He blamed ignorance, and he blamed the priest more than the villagers.</p>
<p>On 1 March 1755 Maria Theresa issued a decree for all her lands. No grave was to be opened for suspicion of vampirism, and no body burned, without the permission of the civil authorities, after examination by a physician. The clergy were forbidden to take part. The belief itself was declared superstition, and “posthumous magic” was removed from the things a court could consider. The priest at the real village was reprimanded; the villagers were not prosecuted. After 1755, when a village in the Habsburg lands opened a grave, the authorities who came were a district official and a physician.</p>
</div></div>
${EPILOGUE.map(q=>`<div class="letter"><div class="from">${q.src}</div><p>${q.text}</p></div>`).join('')}
<h3>Three different state responses</h3>
<ul class="tl">
<li><b>1725</b> Kisiljevo, Serbia. A civil official watches villagers stake and burn a body because he cannot stop them, then writes to Belgrade to say it was not his fault.</li>
<li><b>1732</b> Medveđa, Serbia. The army sends surgeons, who dig up thirteen bodies, examine them, sign a report, and let the soldiers cut off the heads. The state does the work itself and calls it medicine.</li>
<li><b>1755</b> Moravia. The Empress sends her physician, who explains the signs, and she forbids the practice by decree. The state takes the matter away from villages and priests and gives it to officials and doctors.</li>
</ul>
<p style="font-size:17px">The bodies looked the same in 1725, 1732, and 1755. What changed was who the state sent to look at them and what that person had been trained to see. This is enlightened absolutism at work!</p>
${missedC.length?`<h3>Notes he did not agree with</h3><ul class="factors">${missedC.map(c=>`<li><b style="font-weight:400">${c.s}:</b> ${c.t} <i style="color:var(--ink-soft)">(${ANS[c.ans].toLowerCase()})</i></li>`).join('')}</ul>`:'<h3>He agreed with every note</h3><p style="font-size:17px">Every claim in the file was sorted correctly before you wrote to the Empress.</p>'}
<h3>Your run record</h3>
<p style="font-size:17px;color:var(--ink-soft)">Copy this into your assignment if your teacher asks for it.</p>
<div class="recordbox" id="recBox">${esc(rec)}</div>
<div class="row"><button class="btn" type="button" id="btnCopy">Copy record</button><span class="toast" id="toast"></span></div>
<div class="row"><button class="btn quiet" type="button" id="btnAgain">Play again</button></div>
<div class="after">
<h3>The real history</h3>
<p>Documents A, B, and C are close paraphrases of the real texts: Frombald’s 1725 report, printed in the <i>Wienerisches Diarium</i>; Flückinger’s <i>Visum et Repertum</i> of January 1732; and Calmet’s 1746 <i>Dissertation</i>. The dates, numbers, and details in them (the shoes, the sheep, the thirteen bodies, Stana’s age) are from the originals. Document D is adapted from van Swieten’s <i>Commentaries</i> on Boerhaave, a real textbook of the 1740s; the passage is a composite of what it says about winter fevers and about popular belief, shortened and put into plain English. The Moravian case of 1755 is real: in the village of Hermersdorf near Olomouc, a woman named Rosina Polakin was exhumed and burned in January 1755, the Consistory had approved similar acts before, van Swieten and Gasser investigated, and the decree of 1 March 1755 followed. The village of Langendorf, the field dispute, and documents E through I are invented so that the five statements would have clear and different interests behind them. The surgeon’s description of the body is what van Swieten’s own report says such bodies look like. The district captain’s table of three villages is invented; it is the kind of evidence van Swieten used, put into a form that can be counted. The portraits are in the style of the cut-paper silhouettes that became fashionable in these years; none is a likeness.</p>
<p class="sources">Sources: Gerard van Swieten, <i>Remarques sur le vampyrisme de Silésie de l’an 1755</i>; Augustin Calmet, <i>Dissertation sur les revenants en corps… et les vampires</i> (1746); the 1725 and 1732 reports as printed in Paul Barber, <i>Vampires, Burial, and Death</i> (1988); Gábor Klaniczay, “The Decline of Witches and the Rise of Vampires in 18th-Century Habsburg Monarchy,” <i>Ethnologia Europaea</i> (1987); Koen Vermeir, “Vampires as Creatures of the Imagination” (2012).</p>
</div>
</article>`;
  $('btnCopy').addEventListener('click',()=>{ const t=$('toast'); const done=()=>{t.textContent='Copied.';setTimeout(()=>t.textContent='',2500);}; const fb=()=>{const rg=document.createRange();rg.selectNodeContents($('recBox'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);t.textContent='Selected. Press Ctrl+C or Cmd+C.';}; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(rec).then(done,fb); else fb(); });
  $('btnAgain').addEventListener('click',()=>{ try{localStorage.removeItem('vampire1755v2')}catch(e){} S=newState(); go('brief'); });
}

btnRestart.addEventListener('click',()=>{ try{localStorage.removeItem('vampire1755v2')}catch(e){} renderStart(); });

function start(data){
  if(data && data.S && data.S.scene){ S=data.S; go(S.ended?'end':S.scene,true); }
  else renderStart();
}
try{
  if(window.claude && window.claude.hot){
    if(window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({S}));
    if(window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude.hot.data||{});
  } else start({});
}catch(e){ start({}); }

})();
</script>
